<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — EgressView</title>
<meta name="robots" content="noindex">

<style>
  :root{
    --bg:#0d1117; --border:#30363d; --text:#e6edf3; --muted:#8b949e;
    --accent:#58a6ff; --accent-hover:#79c0ff;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--text);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,
      "Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main{position:relative;max-width:560px;padding:48px 24px;text-align:center}
  main::before{
    content:"";position:absolute;width:460px;height:460px;top:-200px;left:50%;
    transform:translateX(-50%);border-radius:50%;background:#1f6feb;
    filter:blur(110px);opacity:.22;pointer-events:none;
  }
  .code{position:relative;font:600 .8rem/1 var(--mono);letter-spacing:.14em;color:var(--muted)}
  h1{position:relative;font-size:1.6rem;font-weight:640;letter-spacing:-.01em;margin:14px 0 10px}
  p{position:relative;color:var(--muted);margin:0 0 28px}
  a.home{
    position:relative;display:inline-block;padding:10px 20px;border-radius:10px;
    border:1px solid var(--border);color:var(--accent);text-decoration:none;
  }
  a.home:hover{color:var(--accent-hover);border-color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>このページはありません<br><span lang="en">This page does not exist</span></h1>
  <p>リンクが古いか、URLが間違っています。<br>
     <span lang="en">The link is out of date, or the address is mistyped.</span></p>
  <a class="home" href="/">EgressView →</a>
</main>
</body>
</html>

<!-- EgressView mark. 全寸法を E の高さ H=340 から黄金比 φ=1.618 で導出:
     ステム/棒の太さ s=H/φ³=80, E幅 W=H/φ=210, 中央棒=W/φ=130,
     E とドット列の間隔 g=s/φ=50, 強調ドット径=s=80, 副ドット径=s/φ=50。
     外接箱は 340×340 の正方形、余白は (512-340)/2=86。
     角丸 114 は黄金比ではなく macOS squircle の慣例値。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EgressView">
  <rect width="512" height="512" rx="114" fill="#0b1424"/>
  <g fill="#4d94ff">
    <rect x="86" y="86" width="80" height="340" rx="19"/>
    <rect x="86" y="86" width="210" height="80" rx="19"/>
    <rect x="86" y="216" width="130" height="80" rx="19"/>
    <rect x="86" y="346" width="210" height="80" rx="19"/>
  </g>
  <circle cx="386" cy="126" r="40" fill="#24d6a2"/>
  <circle cx="386" cy="256" r="25" fill="#4d94ff"/>
  <circle cx="386" cy="386" r="25" fill="#4d94ff"/>
</svg>

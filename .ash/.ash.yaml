project_name: egressview

fail_on_findings: true

global_settings:
  severity_threshold: MEDIUM

  ignore_paths:
    - path: 'node_modules/**'
      reason: 'Third-party dependencies'
    - path: '.ash/**'
      reason: 'ASH output directory'
    - path: 'infra/cdk/cdk.out/**'
      reason: 'Transient CDK synth build output (gitignored, not pushed or deployed with the app). The ALB/WAF/monitoring templates are deployed through a separate reviewed cdk pipeline with its own tests; the specific checkov items (ALB access logs disabled, :80 HTTP->HTTPS redirect listener, SNS topic encryption) are deliberate infra decisions tracked in backlog P2-63.'

  suppressions:
    # ── detect-secrets false positives ──────────────────────────────────────
    # These are the literal word "password"/"secret" appearing in translation
    # strings, npm script names, variable names and a token-alphabet constant —
    # none are real credentials.
    - path: 'src/data/i18n.json'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'UI translation strings containing the word "password"; not a credential'
    - path: 'package.json'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'npm script name "security:secrets"; not a credential'
    - path: 'src/routes/auth-sessions.js'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'Local variable named "password" in login validation; not a credential'
    - path: 'test/unit/auth-route.test.js'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'Fixed authentication failure fixtures; not production credentials'
    - path: 'test/unit/app-state.test.js'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'Test fixture field names such as "passwordHash" describe config keys; not a credential'
    - path: 'src/app-state.js'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'Configuration field names for hashed passwords and OIDC client secrets; no literal credential value'
    - path: 'test/unit/oidc-google.test.js'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'Explicit dummy OIDC client-secret fixture used only with a mocked transport'
    - path: 'test/unit/oidc-google-rejections.test.js'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'Dummy OIDC client-secret fixture for the rejection-path tests; the transport is mocked and no request leaves the process'
    - path: 'test/unit/auth-security-route.test.js'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'Literal placeholder client secrets asserting that the API never echoes a stored secret back; not credentials'
    - path: 'test/unit/auth-sessions-route.test.js'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'Fixed login/lockout fixtures (a dummy password and a stub admin token) matched by a stub verifier; not production credentials'
    - path: 'test/unit/trusted-fingerprints.test.js'
      rule_id: 'SECRET-PRIVATE-KEY'
      reason: 'Dummy truncated PEM fixture asserting the bundle safety check rejects a private key even when named *.pub.pem; not a real key'
    - path: 'src/auth-password.js'
      rule_id: 'SECRET-BASE64-HIGH-ENTROPY-STRING'
      reason: 'Base32 alphabet constant used for token generation; not a secret value'
    - path: 'docs/api-reference.md'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'Documented login request uses an explicit replace-with-your-password placeholder; not a credential'
    - path: 'docs/api-reference.ja.md'
      rule_id: 'SECRET-SECRET-KEYWORD'
      reason: 'Documented login request uses an explicit replace-with-your-password placeholder; not a credential'
    - path: 'scripts/frontend-innerhtml-allowlist.json'
      rule_id: 'SECRET-HEX-HIGH-ENTROPY-STRING'
      reason: 'SHA-256 fingerprints of reviewed frontend source expressions; deterministic code hashes, not credentials'

    # ── dev-only container (not shipped to production) ──────────────────────
    # dev-conntrack/ is a local test router image used only for development;
    # it is never built or deployed to the production EC2 host.
    - path: 'dev-conntrack/router/Dockerfile'
      rule_id: 'CKV_DOCKER_1'
      reason: 'Dev-only test container; SSH port needed for local router emulation'
    - path: 'dev-conntrack/router/Dockerfile'
      rule_id: 'CKV_DOCKER_2'
      reason: 'Dev-only test container; HEALTHCHECK not required for local use'
    - path: 'dev-conntrack/router/Dockerfile'
      rule_id: 'CKV_DOCKER_3'
      reason: 'Dev-only test container; root needed to emulate router services'
    - path: 'dev-conntrack/router/Dockerfile'
      rule_id: 'CKV2_DOCKER_17'
      reason: 'Dev-only test container; chpasswd used to seed a throwaway test login'

    # ── verified-safe application code ──────────────────────────────────────
    - path: 'server.js'
      rule_id: 'javascript.express.security.audit.express-path-join-resolve-traversal.express-path-join-resolve-traversal'
      reason: 'filename validated by ^[A-Za-z0-9._-]+\.js$ (no path separators) plus an explicit basename containment check before fs.readFile'

  # Inline pragmas also used for detect-secrets:
  # server.js: // pragma: allowlist secret
  # docs/setup-yamaha.md: <!-- pragma: allowlist secret -->

scanners:
  semgrep:
    enabled: true
    options:
      config: p/owasp-top-ten

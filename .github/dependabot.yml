version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Wait 7 days before proposing updates to newly published versions so that
    # a compromised/unstable release has time to be caught and yanked.
    cooldown:
      default-days: 7
    ignore:
      # better-sqlite3 13.0.2 cannot run on the EC2 host. It ships prebuilt
      # binaries inside the tarball (prebuildify), which is otherwise an
      # improvement -- 12.x downloads one at install time, so 13.x is the
      # better shape for air-gapped installs. The problem is the binary
      # itself: prebuilds/linux-arm64.node requires GLIBC_2.38, and the host
      # is aarch64 Amazon Linux 2023 with glibc 2.34, so the module fails to
      # load. Upstream issue #1509 tracks this and is open.
      #
      # The x64 prebuild only needs GLIBC_2.34, so CI (x64 runners) passes
      # while production would break -- the reason this must be pinned rather
      # than left to a green pipeline.
      #
      # 13.0.0 and 13.0.1 were a separate, now-fixed problem: they dropped
      # prebuild-install and compiled from source on every install.
      #
      # Lift this once #1509 is resolved and the arm64 prebuild links against
      # a glibc the host actually has.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch all non-major updates into one PR to reduce noise.
      # Security updates still get their own PR from GitHub automatically.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions (ci.yml etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

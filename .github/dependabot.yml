version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Wait 7 days before proposing updates to newly published versions so that
    # a compromised/unstable release has time to be caught and yanked.
    cooldown:
      default-days: 7
    # better-sqlite3 majors were ignored here between 2026-08-03 and
    # 2026-08-06. 13.0.2 shipped a prebuilds/linux-arm64.node linked against
    # GLIBC_2.38 while the EC2 host (aarch64 Amazon Linux 2023, glibc 2.34)
    # could not load it -- and because the x64 prebuild needed only 2.34, CI
    # stayed green while production would have broken. Upstream
    # WiseLibs/better-sqlite3#1509 was the cause: the arm64 prebuild was built
    # on Ubuntu 24.04. 13.0.3 builds it on ubuntu-22.04-arm and needs 2.34, so
    # the ignore was lifted.
    #
    # Adopting 13.x also required ignore-scripts (see .npmrc): 13.x ships a
    # binding.gyp with no install script, which npm turns into an implicit
    # `node-gyp rebuild`. Upstream closed WiseLibs/better-sqlite3#1503 with
    # `"gypfile": false`, a field npm 8+ ignores.
    #
    # A native-module major is still not a green-CI decision. Check the
    # prebuild against the deployment host, and check that install does not
    # need a toolchain, before accepting one. See CONTRIBUTING.md.
    groups:
      # Batch all non-major updates into one PR to reduce noise.
      # Security updates still get their own PR from GitHub automatically.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions (ci.yml etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

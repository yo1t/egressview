version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Wait 7 days before proposing updates to newly published versions so that
    # a compromised/unstable release has time to be caught and yanked.
    cooldown:
      default-days: 7
    groups:
      # Batch all non-major updates into one PR to reduce noise.
      # Security updates still get their own PR from GitHub automatically.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions (ci.yml etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

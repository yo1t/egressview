name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

# Least-privilege default for all jobs; individual jobs can widen if needed.
permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

  security:
    name: Release safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production dependencies
        run: npm run security:audit

      - name: Secret scan
        run: npm run security:secrets

  ash:
    name: ASH security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Install ASH
        # Pinned to match the version used for the local pre-push gate so CI and
        # local scans apply the same scanner rulesets and suppressions.
        run: pip install "git+https://github.com/awslabs/automated-security-helper.git@v3.5.7"

      - name: Run ASH scan
        # --mode local runs the scanners on the ubuntu-latest runner (Docker +
        # Python available). Fails the job (exit 2) when actionable findings > 0,
        # honouring the suppressions committed in .ash/.ash.yaml.
        run: ash --mode local --fail-on-findings

      - name: Upload ASH results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ash-output
          path: .ash/ash_output
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    # Run on schedule, manual dispatch, and on every push/PR (uses demo mode so no hardware needed)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start EgressView (demo mode)
        run: |
          DEMO_MODE=true DEMO_ADMIN_TOKEN=demo-token-ci PORT=3002 npm start > server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3002 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run smoke tests
        env:
          EGRESSVIEW_URL: http://localhost:3002
          EGRESSVIEW_TOKEN: demo-token-ci
        run: npm run test:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
            server.log
          if-no-files-found: ignore
          retention-days: 7

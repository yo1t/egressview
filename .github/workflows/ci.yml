name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

# Least-privilege default for all jobs; individual jobs can widen if needed.
permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22 is Maintenance LTS, 24 is Active LTS, 26 is Current and becomes
        # LTS in October 2026 -- testing it now means the LTS promotion is a
        # non-event rather than the moment incompatibilities surface.
        # engines stays >=22: this proves the code runs on 26, it does not
        # require it.
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage gate
        if: matrix.node-version == 22
        run: npm run test:coverage

      - name: Run unit tests
        if: matrix.node-version != 22
        run: npm test

      # Short campaign only. The long run is `npm run test:fuzz:long`, kept out
      # of the PR gate so a rare generated input cannot make CI flaky.
      - name: Run parser fuzz tests
        if: matrix.node-version == 22
        run: npm run test:fuzz

  conntrack-integration:
    name: conntrack collection path
    # The one hardware integration that does not need hardware. SSH in, work
    # out where the table lives, read it, parse real NAT sessions -- a path
    # that until now was only ever exercised against somebody's router, which
    # means it was not exercised at all between releases.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start a router with a real conntrack table
        id: router
        run: |
          set -euo pipefail
          # Generated per run and never written to the repository, so there is
          # no committed credential even for a throwaway container.
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          docker build -t egressview-conntrack-router test/fixtures/conntrack-router
          docker run -d --name conntrack-router --privileged \
            -e "ROUTER_PASSWORD=$password" -p 2222:22 egressview-conntrack-router

      - name: Wait for it to answer
        # `nc -z` only proves the port is bound, and the first run failed with
        # "Connection lost before handshake" because sshd had the socket but
        # was not serving yet. Waiting for the version banner waits for the
        # thing the poller actually needs.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            banner=$(timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222; head -c 20 <&3' 2>/dev/null || true)
            if [[ "$banner" == SSH-* ]]; then
              echo "ssh serving after ${attempt} attempts: ${banner%%$'\r'*}"
              exit 0
            fi
            sleep 2
          done
          docker logs conntrack-router
          exit 1

      - name: Collect from it
        env:
          RUN_CONNTRACK_DOCKER: '1'
          EGRESSVIEW_CONNTRACK_TEST_HOST: 127.0.0.1
          EGRESSVIEW_CONNTRACK_TEST_PORT: '2222'
          EGRESSVIEW_CONNTRACK_TEST_USER: root
          EGRESSVIEW_CONNTRACK_TEST_PASS: ${{ steps.router.outputs.password }}
        run: node --test test/integration/conntrack-docker.test.js

      - name: Show the container's log if that failed
        if: failure()
        run: docker logs conntrack-router || true

      - name: Stop it
        if: always()
        run: docker rm -f conntrack-router || true

  production-image:
    name: Production image
    # An untested Dockerfile in the repository is the claim of a supported
    # artifact without the support. This builds it and checks the container
    # actually comes up and reports itself ready.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t egressview:ci .

      - name: Start it the way the file says to
        run: |
          set -euo pipefail
          docker run -d --name egressview-ci --init \
            --restart=on-failure:10 -p 3000:3000 -v egressview-ci-data:/data \
            egressview:ci

      - name: Wait for it to report ready
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -sf --max-time 5 http://localhost:3000/readyz >/dev/null; then
              echo "ready after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo 'the container never reported ready' >&2
          docker logs egressview-ci
          exit 1

      - name: Check the database is on the volume, not in the image
        # An image that could hold the database would carry one machine's
        # traffic record into every copy of it. The check is for a database
        # file specifically: an empty directory is not state, and the first
        # version of this step failed on one.
        run: |
          set -euo pipefail
          docker exec egressview-ci sh -c 'test -f /data/egressview.db' \
            || { echo 'the running container did not put its database on /data' >&2; exit 1; }
          if docker run --rm --entrypoint sh egressview:ci \
               -c 'find / -xdev -name "*.db" -not -path "/proc/*" | grep .'; then
            echo 'the image ships a database' >&2
            exit 1
          fi
          echo 'the image ships no database'

      - name: Stop it
        if: always()
        run: docker rm -f egressview-ci || true

  security:
    name: Release safety checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production dependencies
        run: npm run security:audit

      - name: Secret scan
        run: npm run security:secrets

  portability:
    name: Offline portability (${{ matrix.runtime }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [linux-host, debian-container]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: matrix.runtime == 'linux-host'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Run host portability gate
        if: matrix.runtime == 'linux-host'
        run: npm ci && npm run test:portability

      - name: Run container portability gate
        if: matrix.runtime == 'debian-container'
        run: |
          docker build -f test/portability/Dockerfile -t egressview-portability .
          docker run --rm \
            --network none \
            egressview-portability

  offline-distribution:
    name: Signed offline-runtime distribution
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Build and sign an isolated test artifact
        run: |
          openssl genpkey -algorithm ED25519 -out /tmp/egressview-offline-test.key
          npm run offline:bundle -- \
            --output dist/offline \
            --private-key /tmp/egressview-offline-test.key

      - name: Verify signature, checksum, manifest, and content policy
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARTIFACT="dist/offline/egressview-offline-${VERSION}.tar.gz"
          npm run offline:verify -- \
            --artifact "$ARTIFACT" \
            --checksum "${ARTIFACT}.sha256" \
            --signature "${ARTIFACT}.sig" \
            --public-key "${ARTIFACT}.pub.pem"

      - name: Reject a modified signed artifact
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARTIFACT="dist/offline/egressview-offline-${VERSION}.tar.gz"
          cp "$ARTIFACT" "${ARTIFACT}.pristine"
          printf 'tampered' >> "$ARTIFACT"
          if npm run offline:verify -- \
            --artifact "$ARTIFACT" \
            --checksum "${ARTIFACT}.sha256" \
            --signature "${ARTIFACT}.sig" \
            --public-key "${ARTIFACT}.pub.pem"; then
            echo "Modified artifact was accepted" >&2
            exit 1
          fi
          mv "${ARTIFACT}.pristine" "$ARTIFACT"

      - name: Install dependencies and verify offline runtime startup
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARTIFACT="dist/offline/egressview-offline-${VERSION}.tar.gz"
          node scripts/check-offline-artifact.js --artifact "$ARTIFACT"

  ash:
    name: ASH security scan
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install ASH
        # Pinned to match the version used for the local pre-push gate so CI and
        # local scans apply the same scanner rulesets and suppressions.
        run: pip install "git+https://github.com/awslabs/automated-security-helper.git@v3.5.7"

      - name: Run ASH scan
        # --mode local runs the scanners on the ubuntu-latest runner (Docker +
        # Python available). Fails the job (exit 2) when actionable findings > 0,
        # honouring the suppressions committed in .ash/.ash.yaml.
        run: ash --mode local --fail-on-findings

      - name: Upload ASH SARIF to code scanning
        if: >-
          always()
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          sarif_file: .ash/ash_output/reports/ash.ghas.sarif
          category: ash

      - name: Upload ASH results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ash-output
          path: .ash/ash_output
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Browser smoke tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Run on schedule, manual dispatch, and on every push/PR (uses demo mode so no hardware needed)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--with-deps` runs apt-get, which is where this hung for six hours on
      # 2026-08-19: no output, no failure, just a job that never ended while
      # the pull request sat unmergeable. Bounded and retried, so a slow
      # package mirror costs a minute instead of an afternoon.
      - name: Install Playwright browser
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install attempt $attempt failed or timed out"
            sleep 10
          done
          exit 1

      - name: Start EgressView (demo mode)
        run: |
          DEMO_MODE=true DEMO_ADMIN_TOKEN=demo-token-ci PORT=3002 npm start > server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3002 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run smoke tests
        env:
          EGRESSVIEW_URL: http://localhost:3002
          EGRESSVIEW_TOKEN: demo-token-ci
        run: npm run test:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
            server.log
          if-no-files-found: ignore
          retention-days: 7

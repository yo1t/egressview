name: macOS agent

# Runs on every pull request so that "build-and-test" can be a required check
# (P3-111): a required check from a path-filtered workflow never reports on a
# PR that does not touch those paths, and that PR could never merge. The
# "changes" job decides; build-and-test is skipped when nothing under the
# agent changed, and GitHub counts a skipped required check as passing.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/agent-macos/**"
      - ".github/workflows/macos-agent.yml"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent: ${{ steps.diff.outputs.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          else
            range="$BEFORE...HEAD"
          fi
          if git diff --name-only "$range" | grep -qE '^(apps/agent-macos/|\.github/workflows/macos-agent\.yml$)'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Swift package
        working-directory: apps/agent-macos
        run: swift test
      - name: Build host app and System Extension without signing
        working-directory: apps/agent-macos
        run: >-
          xcodebuild
          -project EgressViewAgent.xcodeproj
          -scheme 'EgressView Agent'
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/egressview-agent-derived"
          CODE_SIGNING_ALLOWED=NO
          ONLY_ACTIVE_ARCH=YES
          build
      - name: Verify System Extension package identity
        working-directory: apps/agent-macos
        run: |
          extension="$RUNNER_TEMP/egressview-agent-derived/Build/Products/Debug/EgressView Agent.app/Contents/Library/SystemExtensions/com.egressview.agent.filter.systemextension"
          test -d "$extension"
          test "$(plutil -extract CFBundleIdentifier raw "$extension/Contents/Info.plist")" = "com.egressview.agent.filter"
          test -n "$(plutil -extract NSSystemExtensionUsageDescription raw "$extension/Contents/Info.plist")"
          # Per build, so an old System Extension cannot keep the name across
          # an update and leave the new listener with "Operation not
          # permitted" while monitoring silently stops.
          build="$(plutil -extract CFBundleVersion raw "$extension/Contents/Info.plist")"
          test "$(plutil -extract NetworkExtension.NEMachServiceName raw "$extension/Contents/Info.plist")" = "group.com.egressview.agent.xpc.$build"
          ! plutil -extract NEMachServiceName raw "$extension/Contents/Info.plist" >/dev/null 2>&1
          ! plutil -extract com.apple.security.xpc.mach-service.name raw Xcode/SystemExtension/EgressViewFilter.entitlements >/dev/null 2>&1
          ! plutil -extract com.apple.security.xpc.mach-service.name raw Xcode/SystemExtension/EgressViewFilter.DeveloperID.entitlements >/dev/null 2>&1
          grep -Fq 'NEProvider.startSystemExtensionMode()' Xcode/SystemExtension/main.swift
          grep -Fq 'dispatchMain()' Xcode/SystemExtension/main.swift
          grep -Fq 'newConnection.setCodeSigningRequirement(requirement)' Xcode/SystemExtension/FullMonitoringXPCServer.swift
          ! grep -Fq 'kSecGuestAttributePid' Xcode/SystemExtension/FullMonitoringXPCServer.swift

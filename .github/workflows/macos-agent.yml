name: macOS agent

on:
  pull_request:
    paths:
      - "apps/agent-macos/**"
      - ".github/workflows/macos-agent.yml"
  push:
    branches: [main]
    paths:
      - "apps/agent-macos/**"
      - ".github/workflows/macos-agent.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Swift package
        working-directory: apps/agent-macos
        run: swift test
      - name: Build host app and System Extension without signing
        working-directory: apps/agent-macos
        run: >-
          xcodebuild
          -project EgressViewAgent.xcodeproj
          -scheme 'EgressView Agent'
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/egressview-agent-derived"
          CODE_SIGNING_ALLOWED=NO
          ONLY_ACTIVE_ARCH=YES
          build
      - name: Verify System Extension package identity
        working-directory: apps/agent-macos
        run: |
          extension="$RUNNER_TEMP/egressview-agent-derived/Build/Products/Debug/EgressView Agent.app/Contents/Library/SystemExtensions/com.egressview.agent.filter.systemextension"
          test -d "$extension"
          test "$(plutil -extract CFBundleIdentifier raw "$extension/Contents/Info.plist")" = "com.egressview.agent.filter"
          test -n "$(plutil -extract NSSystemExtensionUsageDescription raw "$extension/Contents/Info.plist")"
          test "$(plutil -extract NetworkExtension.NEMachServiceName raw "$extension/Contents/Info.plist")" = "group.com.egressview.agent.xpc"
          ! plutil -extract NEMachServiceName raw "$extension/Contents/Info.plist" >/dev/null 2>&1
          ! plutil -extract com.apple.security.xpc.mach-service.name raw Xcode/SystemExtension/EgressViewFilter.entitlements >/dev/null 2>&1
          ! plutil -extract com.apple.security.xpc.mach-service.name raw Xcode/SystemExtension/EgressViewFilter.DeveloperID.entitlements >/dev/null 2>&1
          grep -Fq 'NEProvider.startSystemExtensionMode()' Xcode/SystemExtension/main.swift
          grep -Fq 'dispatchMain()' Xcode/SystemExtension/main.swift
          grep -Fq 'SecCodeCheckValidity' Xcode/SystemExtension/FullMonitoringXPCServer.swift

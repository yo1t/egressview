name: Product site

# Publishes www.egressview.com. The same Jekyll build that GitHub Pages runs,
# uploaded to the site's own bucket, so the two hosts cannot show different
# content from the same commit.
#
# There is no stored AWS key: the job exchanges a short-lived GitHub OIDC token
# for a role that may write to the site bucket and invalidate the site
# distribution, and nothing else. The role trusts refs/heads/main only.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/prepare-pages-source.js'
      - 'scripts/site-repository-links.js'
      - 'scripts/check-site-repository-links.js'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: product-site
  cancel-in-progress: false

jobs:
  publish:
    # Skipped rather than failed when the deployment inputs are not configured,
    # so a fork does not report a red run it cannot fix.
    if: vars.AWS_SITE_BUCKET != ''
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: product-site
      url: https://www.egressview.com/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Pages source
        run: node scripts/prepare-pages-source.js

      - name: Build for this site's host, not the Pages path
        # One Jekyll source serves two hosts. Without this the build inherits
        # the Pages baseurl and canonical host, which makes every docs link
        # here a 404 and hands the canonical to the other copy.
        run: cp site/_config.www.yml .pages-source/_config.yml

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./.pages-source
          destination: ./_site

      - name: Check repository links point at published files
        run: node scripts/check-site-repository-links.js _site

      - name: Check the build produced the pages we publish
        # A Jekyll change that stops converting docs would otherwise be
        # published as a site full of 404s.
        run: |
          set -euo pipefail
          for page in index.html index.ja.html products.html 404.html robots.txt \
                      sitemap.xml docs/architecture.html \
                      docs/agent-privacy.html docs/agent-privacy.ja.html                       docs/agent-privacy-windows.html docs/agent-privacy-windows.ja.html; do
            test -s "_site/$page" || { echo "missing or empty: $page" >&2; exit 1; }
          done

      - name: Check the links belong to this site
        # The failure this catches shipped once: every docs page linked to
        # /egressview/... , which is the path on the other host, and every
        # canonical named that host as the original.
        run: |
          set -euo pipefail
          if grep -rlE 'href="/egressview/' _site --include='*.html' | head -5 | grep .; then
            echo 'links carry the GitHub Pages baseurl; _config.www.yml was not applied' >&2
            exit 1
          fi
          if grep -rl 'rel="canonical" href="https://yo1t.github.io' _site --include='*.html' \
             | head -5 | grep .; then
            echo 'canonical points at the GitHub Pages copy' >&2
            exit 1
          fi

      - name: Check each document names its other-language version
        # Without these, a crawler has no way to know architecture.html and
        # architecture.ja.html are one document, and has to guess which to
        # show.
        run: |
          set -euo pipefail
          for page in docs/architecture.html docs/architecture.ja.html; do
            for lang in en ja x-default; do
              grep -q "hreflang=\"$lang\"" "_site/$page" || {
                echo "$page has no hreflang=$lang link" >&2; exit 1; }
            done
          done
          grep -q 'hreflang="ja" href="https://www.egressview.com/docs/architecture.ja.html"' \
            _site/docs/architecture.html || {
            echo 'hreflang does not point at the Japanese page on www' >&2; exit 1; }
          # The top page and its Japanese page, which carries the Japanese in
          # its markup so it can be indexed (scripts/build-site-japanese.js).
          for page in index.html index.ja.html; do
            grep -q 'hreflang="ja" href="https://www.egressview.com/index.ja.html"' "_site/$page" || {
              echo "$page does not name the Japanese top page" >&2; exit 1; }
          done
          grep -q '<html lang="ja">' _site/index.ja.html || {
            echo 'index.ja.html is not a Japanese page' >&2; exit 1; }

      - name: Check the sitemap lists this site, and only this site
        # It was hand-written and listed two URLs while the site served over
        # forty, so every documentation page was invisible to search engines --
        # and one of the two was on another host, where a sitemap entry is
        # ignored anyway.
        run: |
          set -euo pipefail
          test -s _site/sitemap.xml || { echo 'no sitemap was generated' >&2; exit 1; }
          count=$(grep -c '<loc>' _site/sitemap.xml || true)
          [ "$count" -ge 20 ] || {
            echo "sitemap lists only $count URLs; the docs are missing" >&2; exit 1; }
          for required in 'https://www.egressview.com/' \
                          'https://www.egressview.com/index.ja.html' \
                          'https://www.egressview.com/products.html' \
                          'https://www.egressview.com/docs/' \
                          'https://www.egressview.com/docs/agent-privacy.html' \
                          'https://www.egressview.com/docs/agent-privacy.ja.html'                           'https://www.egressview.com/docs/agent-privacy-windows.html'                           'https://www.egressview.com/docs/agent-privacy-windows.ja.html'; do
            grep -q "<loc>$required</loc>" _site/sitemap.xml || {
              echo "sitemap is missing $required" >&2; exit 1; }
          done
          for forbidden in 'dl.egressview.com' 'yo1t.github.io' '/404.html' 'www.egressview.com/dl/'; do
            if grep -q "$forbidden" _site/sitemap.xml; then
              echo "sitemap should not list $forbidden" >&2; exit 1
            fi
          done

      - name: Assume the publishing role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_SITE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_SITE_REGION }}
          role-session-name: site-deploy-${{ github.run_id }}

      - name: Upload the site
        # Short TTLs because the site is small and republished as a whole;
        # correctness after a deploy matters more than shaving requests.
        run: |
          aws s3 sync ./_site "s3://${{ vars.AWS_SITE_BUCKET }}/" \
            --delete --no-progress \
            --exclude '*.md' \
            --cache-control 'public, max-age=300'

      - name: Invalidate the cache
        run: |
          set -euo pipefail
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_SITE_DISTRIBUTION_ID }}" \
            --paths '/*' --query 'Invalidation.Id' --output text)
          echo "invalidation $id"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.AWS_SITE_DISTRIBUTION_ID }}" --id "$id"

      - name: Verify what is actually being served
        # Reporting success without checking is how a broken deploy stays
        # unnoticed until someone visits.
        run: |
          set -euo pipefail
          base=https://www.egressview.com
          check() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$base$1")
            echo "$1 -> $code"
            [ "$code" = "$2" ] || exit 1
          }
          check / 200
          check /docs/architecture.html 200
          check /this-path-does-not-exist 404
